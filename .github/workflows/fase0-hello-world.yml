
name: Fase 0 - testar toolchain (hello_world oficial)

on:
  workflow_dispatch:

jobs:
  hello-world:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o codigo deste projeto
        uses: actions/checkout@v4

      - name: Baixar os exemplos oficiais do OpenOrbis
        uses: actions/checkout@v4
        with:
          repository: OpenOrbis/OpenOrbis-PS4-Toolchain
          ref: v0.5.1
          path: oo

      - name: Diagnosticar toolchain e exemplo
        run: |
          docker run --rm \
                - name: Disponibilizar PKG para download
      - uses: actions/upload-artifact@v4
        with:
          name: hello-world-pkg
          path: oo/samples/hello_world/*.pkg
          if-no-files-found: error
            --user 0:0 \
            -v "$GITHUB_WORKSPACE/oo:/workspace" \
            -w /workspace/samples/hello_world \
            openorbisofficial/toolchain:v0.5.1 \
                    bash -lc 'set -e; make; /lib/OpenOrbisSDK/bin/linux/PkgTool.Core pkg_build pkg/pkg.gp4 .; echo "=== PKG GERADO ==="; find . -maxdepth 1 -type f -name "*.pkg"'
