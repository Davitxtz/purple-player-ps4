
name: Fase 0 - testar toolchain (graphics oficial)

on:
  workflow_dispatch:

jobs:
  graphics:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o codigo deste projeto
        uses: actions/checkout@v4

      - name: Baixar os exemplos oficiais do OpenOrbis
        uses: actions/checkout@v4
        with:
          repository: OpenOrbis/OpenOrbis-PS4-Toolchain
          ref: v0.5.1
          path: oo

      - name: Compilar e empacotar exemplo grafico
        run: |
          docker run --rm \
            --user 0:0 \
            -v "$GITHUB_WORKSPACE/oo:/workspace" \
            -w /workspace/samples/graphics \
            openorbisofficial/toolchain:v0.5.1 \
            bash -lc 'set -e
              sed -i "s|^COMMONDIR.*|COMMONDIR   := /workspace/samples/_common|" Makefile
              make clean
              make
              /lib/OpenOrbisSDK/bin/linux/PkgTool.Core pkg_build pkg/pkg.gp4 .
              echo "=== PKG GERADO ==="
              find . -maxdepth 1 -type f -name "*.pkg"'

      - name: Disponibilizar PKG para download
        uses: actions/upload-artifact@v4
        with:
          name: graphics-teste-pkg
          path: oo/samples/graphics/*.pkg
          if-no-files-found: error
