
name: Fase 0 - testar toolchain (hello_world oficial)

on:
  workflow_dispatch:

jobs:
  hello-world:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o codigo deste projeto
        uses: actions/checkout@v4

      - name: Baixar os exemplos oficiais do OpenOrbis
        uses: actions/checkout@v4
        with:
          repository: OpenOrbis/OpenOrbis-PS4-Toolchain
          ref: v0.5.1
          path: oo

      - name: Diagnosticar toolchain e exemplo
        run: |
          docker run --rm \
            --user 0:0 \
            -v "$GITHUB_WORKSPACE/oo:/workspace" \
            -w /workspace/samples/hello_world \
            openorbisofficial/toolchain:v0.5.1 \
                    bash -lc 'echo "=== GP4 DO EXEMPLO ==="; find /workspace/samples/hello_world -type f -name "*.gp4"; echo "=== TEMPLATE DO SDK ==="; sed -n "1,100p" /lib/OpenOrbisSDK/bin/data/template.gp4; echo "=== ESTRUTURA DO EXEMPLO ==="; find /workspace/samples/hello_world -maxdepth 3 -type f | head -80'
