
name: Fase 0 - testar toolchain (hello_world oficial)

on:
  workflow_dispatch:

jobs:
  hello-world:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o codigo deste projeto
        uses: actions/checkout@v4

      - name: Baixar os exemplos oficiais do OpenOrbis
        uses: actions/checkout@v4
        with:
          repository: OpenOrbis/OpenOrbis-PS4-Toolchain
          path: oo

      - name: Diagnosticar toolchain e exemplo
        run: |
          docker run --rm \
            --user 0:0 \
            -v "$GITHUB_WORKSPACE/oo:/workspace" \
            -w /workspace/samples/hello_world \
            openorbisofficial/toolchain:v0.5.1 \
                 bash -lc 'echo "=== DIRETORIO ==="; pwd; echo "=== CONTEUDO ==="; ls -la; echo "=== LOCALIZAR MAKEFILE ==="; find /workspace -name Makefile -o -name make_fself.py -o -name PkgTool.Core 2>/dev/null; echo "=== SDK ==="; ls -la /lib/OpenOrbisSDK /usr/lib/OpenOrbisSDK 2>&1'

