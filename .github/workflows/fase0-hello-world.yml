
name: Fase 0 - testar toolchain (hello_world oficial)

on:
  workflow_dispatch:

jobs:
  hello-world:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o codigo deste projeto
        uses: actions/checkout@v4

      - name: Baixar os exemplos oficiais do OpenOrbis
        uses: actions/checkout@v4
        with:
          repository: OpenOrbis/OpenOrbis-PS4-Toolchain
          ref: v0.5.1
          path: oo

      - name: Diagnosticar toolchain e exemplo
        run: |
          docker run --rm \
            --user 0:0 \
            -v "$GITHUB_WORKSPACE/oo:/workspace" \
            -w /workspace/samples/hello_world \
            openorbisofficial/toolchain:v0.5.1 \
                    bash -lc 'echo "=== SCRIPT FSELF ==="; python3 /workspace/scripts/make_fself.py --help 2>&1 || true; echo "=== BINARIOS DO SDK ==="; find /lib/OpenOrbisSDK/bin -maxdepth 3 -type f 2>/dev/null | head -80; echo "=== MAKEFILE ==="; sed -n "1,45p" Makefile'
